name: AI

on:
  # PR은 경로와 상관없이 돌린다. 필수 상태 체크로 걸어도 문서만 바꾼 PR이 대기에 걸리지 않는다.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'AI/**'
      - '.github/workflows/ai.yml'

permissions:
  contents: read

concurrency:
  # main 푸시는 실행마다 별도 그룹이다. 같은 그룹이면 대기 중인 실행이 새 실행에 밀려 커밋 하나가 검사되지 않는다.
  group: ai-${{ github.event_name == 'push' && github.run_id || github.ref }}
  # PR에서만 앞 실행을 취소한다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: AI
    steps:
      # 액션은 태그가 아니라 커밋 SHA로 고정한다. 올릴 때는 손으로 바꾼다(Dependabot 없음).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # uv 버전은 AI/Dockerfile과 같게 둔다. Python은 AI/.python-version(3.12)을 uv가 받는다.
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.11.32'
          enable-cache: true
          cache-dependency-glob: AI/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
