# One student service in proj-demo, showing the fields the leader deploy executor's student-app chart
# must render for every service (design: docs/design/cluster.md §6 and §8). The image is a public test app.
# Apply after space.yaml:
#   ssh k3s-leader 'sudo k3s kubectl apply -f -' < Infra/student/app-example.yaml
# The Ingress gives the project its public address <name>.stairnoworks.com (cluster.md §9). The tunnel
# sends every such name to Traefik, so an Ingress is all a new address needs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: proj-demo
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # Workers only. The leader taint also keeps student Pods off the leader if this is missing.
      nodeSelector:
        wanggane/pool: student
      # No API token in student Pods. Like the NET_RAW drop below, the admission policy
      # wanggane-student-pods (Infra/platform/policies.yaml) rejects Pods and Deployments without it.
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - name: web
        image: ghcr.io/stefanprodan/podinfo:6.15.0
        ports:
        - containerPort: 9898
        securityContext:
          # baseline keeps NET_RAW, which lets a Pod spoof ARP on its worker.
          capabilities:
            drop: ["NET_RAW"]
        # No resources: the space's LimitRange fills in the defaults.
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9898
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: proj-demo
spec:
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 9898
---
# Only for a service whose deploy input has runtime.stripPrefix: true (#72): Traefik removes the public
# path prefix before the request reaches the app, so /svc/readyz arrives as /readyz. An Ingress alone
# cannot do this. A Middleware in a student space may hold stripPrefix and nothing else (admission policy
# wanggane-student-middlewares, Infra/executor/policies.yaml).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: web-strip
  namespace: proj-demo
spec:
  stripPrefix:
    prefixes: ["/svc"]
---
# HTTPS ends at Cloudflare; the tunnel reaches Traefik over plain HTTP inside the cluster, so no TLS here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: proj-demo
  annotations:
    # <namespace>-<Middleware name>@kubernetescrd. The annotation covers every path of this Ingress, so
    # the open and the test Ingress both carry it, and a service that keeps its prefix needs an Ingress
    # of its own. Traefik collapses repeated hyphens in that name: in proj-a--b write proj-a-b-web-strip,
    # or the Middleware is not found and the whole Ingress answers 404.
    traefik.ingress.kubernetes.io/router.middlewares: proj-demo-web-strip@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: demo.stairnoworks.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
