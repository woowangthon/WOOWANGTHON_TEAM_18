# One student service in proj-demo, showing the fields the leader deploy executor's student-app chart
# must render for every service (design: docs/design/cluster.md §6). The image is a public test app.
# Apply after space.yaml:
#   ssh k3s-leader 'sudo k3s kubectl apply -f -' < Infra/student/app-example.yaml
# The Ingress (public address) is added with the tunnel in build stage 10.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: proj-demo
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # Workers only. The leader taint also keeps student Pods off the leader if this is missing.
      nodeSelector:
        wanggane/pool: student
      # No API token in student Pods. Like the NET_RAW drop below, the build-09 admission policy
      # rejects Pods without it.
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
      - name: web
        image: ghcr.io/stefanprodan/podinfo:6.15.0
        ports:
        - containerPort: 9898
        securityContext:
          # baseline keeps NET_RAW, which lets a Pod spoof ARP on its worker.
          capabilities:
            drop: ["NET_RAW"]
        # No resources: the space's LimitRange fills in the defaults.
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9898
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: proj-demo
spec:
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 9898
