# Source: student-app/templates/slot.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe-b
  labels:
    app: fe
    slot: b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fe
      slot: b
  template:
    metadata:
      labels:
        app: fe
        slot: b
      annotations:
        wanggane/secret-hash: "sha256:abc"
    spec:
      nodeSelector:
        wanggane/pool: student
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: fe
          image: "ghcr.io/woowang-bot/student-apps@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fe-b
          securityContext:
            capabilities:
              drop: ["NET_RAW"]
          resources:
            limits:
              cpu: "1"
              ephemeral-storage: 4Gi
              memory: 2Gi
            requests:
              cpu: 250m
              ephemeral-storage: 1Gi
              memory: 256Mi
          startupProbe:
            failureThreshold: 2
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
