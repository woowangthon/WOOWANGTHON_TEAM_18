      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: be
          image: "ghcr.io/woowang-bot/student-apps@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: be-b
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: be-secrets
                  key: DATABASE_URL
          securityContext:
            capabilities:
              drop: ["NET_RAW"]
          resources:
            limits:
              cpu: "1"
              ephemeral-storage: 4Gi
              memory: 2Gi
            requests:
              cpu: 250m
              ephemeral-storage: 1Gi
              memory: 256Mi
          startupProbe:
            failureThreshold: 12
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
