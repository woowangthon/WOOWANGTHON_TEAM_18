kind: Ingress
metadata:
  name: test
  labels:
    wanggane/ingress: test
spec:
  ingressClassName: traefik
  rules:
    - host: "my-app.test.internal"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: fe-b
                port:
