---
# Source: student-app/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-fe
  labels:
    wanggane/ingress: open
    app: fe
spec:
  ingressClassName: traefik
  rules:
    - host: "my-app.stairnoworks.com"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: fe-b
                port:
                  number: 8080
---
# Source: student-app/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-be
  labels:
    wanggane/ingress: open
    app: be
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "proj-my-app-be-strip@kubernetescrd"
spec:
  ingressClassName: traefik
  rules:
    - host: "my-app.stairnoworks.com"
      http:
        paths:
          - path: "/api"
            pathType: Prefix
            backend:
              service:
                name: be-b
                port:
                  number: 3000
---
# Source: student-app/templates/ingress.yaml
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: be-strip
  labels:
    app: be
spec:
  stripPrefix:
    prefixes:
      - "/api"
