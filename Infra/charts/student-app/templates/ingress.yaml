{{- /*
공개 서비스(ingressPath가 있는 서비스)마다 Ingress 하나. part slot이면 test-<서비스>(<slug>.test.internal → 대상 슬롯),
part open이면 open-<서비스>(<slug>.<도메인> → live로 바꿀 슬롯). 경로 규칙이 같아 test를 통과하면 open도 같다(docs/design/deploy-workflow.md §3 · §4).
Traefik의 미들웨어는 Ingress 주석이라 그 Ingress의 모든 경로에 걸린다. 서비스마다 Ingress를 나눠 stripPrefix를 그 서비스에만 건다.
Ingress와 Middleware에는 slot 라벨이 없다: 슬롯을 비울 때 지워지면 live 주소가 끊긴다. live 슬롯 보호는 라벨 wanggane/ingress=open으로 읽는다.
*/ -}}
{{- $kind := ternary "test" "open" (eq .Values.part "slot") }}
{{- $host := ternary .Values.hosts.test .Values.hosts.open (eq .Values.part "slot") }}
{{- range .Values.services }}
{{- if .ingressPath }}
{{- if .stripPrefix }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .name }}-strip
  labels:
    app: {{ .name }}
spec:
  stripPrefix:
    prefixes:
      - {{ .ingressPath | quote }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $kind }}-{{ .name }}
  labels:
    wanggane/ingress: {{ $kind }}
    app: {{ .name }}
  {{- if .stripPrefix }}
  annotations:
    {{- /* Traefik은 Middleware 참조 이름(<공간>-<이름>)의 연달은 하이픈을 하나로 줄인다(cluster.md §8, Traefik 3.7.15). 그대로 적으면 Middleware를 못 찾아 이 Ingress 전체가 404다. */}}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s@kubernetescrd" (regexReplaceAll "-+" (printf "%s-%s-strip" $.Release.Namespace .name) "-") | quote }}
  {{- end }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: {{ .ingressPath | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ .fullName }}
                port:
                  number: {{ .port }}
{{- end }}
{{- end }}
