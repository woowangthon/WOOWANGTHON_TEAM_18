# GHCR pull-through cache on the leader. Nodes pull ghcr.io images through it (Infra/k3s/registries.yaml)
# and fall back to GHCR directly when it is down.
# Design and reasons: docs/design/cluster.md §5.
# Apply (from the operator's machine):
#   ssh k3s-leader 'sudo k3s kubectl apply -f -' < Infra/registry-cache/registry-cache.yaml
#
# hostNetwork, bound to the leader's node address only: the host firewall then applies as for any host
# process (in from 192.168.77.0/24 only, out on 443/53 only). A hostPort would go through DNAT and
# FORWARD and skip the firewall's incoming deny (§3).
apiVersion: v1
kind: Namespace
metadata:
  name: registry-cache
  labels:
    # baseline rejects hostNetwork. Only this operator namespace gets it; the container itself runs
    # non-root with no capabilities.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-cache
  namespace: registry-cache
data:
  config.yml: |
    version: 0.1
    log:
      level: info
    storage:
      filesystem:
        rootdirectory: /var/lib/registry
      # The proxy removes cached content after the TTL; it needs delete to do that.
      delete:
        enabled: true
    http:
      addr: 192.168.77.11:5000
    # Public images only (ADR-003): no upstream credentials.
    proxy:
      remoteurl: https://ghcr.io
      ttl: 168h
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-cache
  namespace: registry-cache
spec:
  storageClassName: local-path
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-cache
  namespace: registry-cache
spec:
  replicas: 1
  # One host port: the old Pod must stop before the new one binds it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry-cache
  template:
    metadata:
      labels:
        app: registry-cache
    spec:
      hostNetwork: true
      # Resolve ghcr.io with the host's resolver, not the in-cluster DNS on the workers.
      dnsPolicy: Default
      enableServiceLinks: false
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: registry
        image: registry:3.1.2
        args: ["serve", "/etc/distribution/config.yml"]
        ports:
        - containerPort: 5000
          protocol: TCP
        # A hostNetwork Pod has the node address as its IP, so the probes hit 192.168.77.11:5000.
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: config
          mountPath: /etc/distribution
          readOnly: true
        - name: data
          mountPath: /var/lib/registry
      volumes:
      - name: config
        configMap:
          name: registry-cache
      - name: data
        persistentVolumeClaim:
          claimName: registry-cache
