# Admission policies for the platform server account and for student Pods (build 09, first part).
# Design and reasons: docs/design/cluster.md §8.
#   wanggane-platform-server   the server account writes only in proj- spaces; namespace and Secret rules
#   wanggane-platform-server-scale     its Deployment scale requests set 0 or 1 replicas (stop, resume)
#   wanggane-platform-server-restart   its Deployment patches change only the restartedAt annotation
#   wanggane-space-*           cap, defaults, isolation and the two bindings (server read, executor deploy) are
#                              created only with the template's name and values
#   wanggane-student-pods      Pods and Deployments in proj- spaces drop NET_RAW, carry no API token and no
#                              toleration, and do not name their node
# The executor's own policies are in Infra/executor/policies.yaml.
# The template values are not copied here: the five wanggane-space-* policies compare against the objects
# in the namespace student-template, which is Infra/student/space.yaml under another name. Apply it first
# (and again whenever space.yaml changes):
#   sed 's/proj-demo/student-template/g' Infra/student/space.yaml | ssh k3s-leader 'sudo k3s kubectl apply -f -'
#   ssh k3s-leader 'sudo k3s kubectl apply -f -' < Infra/platform/policies.yaml
# Order matters: these policies are the only thing that keeps the account's cluster-wide rights
# (account.yaml) inside proj- spaces. Apply this file before account.yaml, and when removing, delete
# account.yaml first. Do not set the wanggane-platform-server or wanggane-space-* bindings to Warn
# while the account exists.
# The server account cannot touch student-template (not a proj- name). If a reference object is missing,
# creating that kind is denied for every account in every namespace (the reference is looked up before the
# account is checked), except in student-template itself, which the policies skip so that the reference can
# always be put back.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: wanggane-platform-server
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["*"]
      apiVersions: ["*"]
      operations: ["CREATE", "UPDATE", "DELETE", "CONNECT"]
      resources: ["*/*"]
      scope: "*"
    # "What may I do" questions change nothing.
    excludeResourceRules:
    - apiGroups: ["authorization.k8s.io", "authentication.k8s.io"]
      apiVersions: ["*"]
      operations: ["*"]
      resources: ["selfsubjectaccessreviews", "selfsubjectrulesreviews", "selfsubjectreviews"]
  matchConditions:
  - name: platform-server-account
    expression: request.userInfo.username == 'system:serviceaccount:platform:platform-server'
  variables:
  - name: isNamespace
    expression: request.resource.group == '' && request.resource.resource == 'namespaces'
  - name: isSecret
    expression: request.resource.group == '' && request.resource.resource == 'secrets'
  # The space a request touches: the namespace's own name, or the namespace of the object.
  - name: space
    expression: >-
      variables.isNamespace
        ? (request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name)
        : request.namespace
  validations:
  - expression: variables.space.startsWith('proj-')
    message: the platform server may write only in proj-<id> spaces
  - expression: "!variables.isNamespace || request.operation in ['CREATE', 'DELETE']"
    message: the platform server may only create or delete a space
  - expression: >-
      !variables.isNamespace || request.operation != 'CREATE' || (
        has(object.metadata.labels)
        && object.metadata.labels.all(k, k in [
             'kubernetes.io/metadata.name',
             'pod-security.kubernetes.io/enforce',
             'pod-security.kubernetes.io/warn'])
        && 'pod-security.kubernetes.io/enforce' in object.metadata.labels
        && object.metadata.labels['pod-security.kubernetes.io/enforce'] == 'baseline'
        && 'pod-security.kubernetes.io/warn' in object.metadata.labels
        && object.metadata.labels['pod-security.kubernetes.io/warn'] == 'restricted'
      )
    message: "a space needs exactly the labels pod-security.kubernetes.io/enforce=baseline and pod-security.kubernetes.io/warn=restricted"
  # A service-account-token Secret would mint an API token inside the space.
  - expression: >-
      !variables.isSecret || request.operation == 'DELETE' || (
        object.type == 'Opaque' && object.metadata.name.endsWith('-secrets') && object.metadata.name.size() > 8
      )
    message: "Secrets must be of type Opaque and named <service>-secrets"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: wanggane-platform-server
spec:
  policyName: wanggane-platform-server
  validationActions: ["Deny"]
---
# The server may stop (0) and resume (1) a service, not resize it. A Scale object leaves spec.replicas
# out when it is 0.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: wanggane-platform-server-scale
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["apps"]
      apiVersions: ["*"]
      operations: ["UPDATE"]
      resources: ["deployments/scale"]
  matchConditions:
  - name: platform-server-account
    expression: request.userInfo.username == 'system:serviceaccount:platform:platform-server'
  validations:
  - expression: "!has(object.spec.replicas) || object.spec.replicas <= 1"
    message: the platform server may only scale a Deployment to 0 or 1 replicas
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: wanggane-platform-server-scale
spec:
  policyName: wanggane-platform-server-scale
  validationActions: ["Deny"]
---
# Restart is kubectl rollout restart: it sets the restartedAt annotation on the Pod template and nothing
# else. Any other change (image, command, env, volumes, labels, replicas, pausing) would let a leaked
# server credential run other code in the space or mount its Secrets, so the whole spec must stay as it
# was. The list below is every field of apps/v1 DeploymentSpec; a field a later Kubernetes adds is not
# compared. The objects here are the stored ones after defaulting, so replicas, strategy,
# revisionHistoryLimit and progressDeadlineSeconds are always present.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: wanggane-platform-server-restart
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["apps"]
      apiVersions: ["*"]
      operations: ["UPDATE"]
      resources: ["deployments"]
  matchConditions:
  - name: platform-server-account
    expression: request.userInfo.username == 'system:serviceaccount:platform:platform-server'
  variables:
  - name: restartKey
    expression: "'kubectl.kubernetes.io/restartedAt'"
  - name: newAnnotations
    expression: "has(object.spec.template.metadata.annotations) ? object.spec.template.metadata.annotations : {}"
  - name: oldAnnotations
    expression: "has(oldObject.spec.template.metadata.annotations) ? oldObject.spec.template.metadata.annotations : {}"
  validations:
  - expression: dyn(object.spec.template.spec) == dyn(oldObject.spec.template.spec)
    message: the platform server may not change a Deployment's Pod spec
  - expression: >-
      (has(object.spec.template.metadata.labels) ? dyn(object.spec.template.metadata.labels) : dyn({}))
      == (has(oldObject.spec.template.metadata.labels) ? dyn(oldObject.spec.template.metadata.labels) : dyn({}))
    message: the platform server may not change a Deployment's Pod labels
  - expression: >-
      variables.newAnnotations.all(k, k == variables.restartKey
        || (k in variables.oldAnnotations && variables.oldAnnotations[k] == variables.newAnnotations[k]))
      && variables.oldAnnotations.all(k, k == variables.restartKey || k in variables.newAnnotations)
    message: the platform server may change only the restartedAt annotation of a Deployment's Pod template
  - expression: >-
      dyn(object.spec.selector) == dyn(oldObject.spec.selector)
      && object.spec.replicas == oldObject.spec.replicas
      && dyn(object.spec.strategy) == dyn(oldObject.spec.strategy)
      && object.spec.revisionHistoryLimit == oldObject.spec.revisionHistoryLimit
      && object.spec.progressDeadlineSeconds == oldObject.spec.progressDeadlineSeconds
      && (has(object.spec.minReadySeconds) ? object.spec.minReadySeconds : 0)
         == (has(oldObject.spec.minReadySeconds) ? oldObject.spec.minReadySeconds : 0)
      && (has(object.spec.paused) && object.spec.paused) == (has(oldObject.spec.paused) && oldObject.spec.paused)
    message: the platform server may not change a Deployment's replicas, selector, strategy or rollout settings (use the scale subresource to stop or resume)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: wanggane-platform-server-restart
spec:
  policyName: wanggane-platform-server-restart
  validationActions: ["Deny"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: wanggane-space-quota
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ResourceQuota
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["resourcequotas"]
    namespaceSelector:
      matchExpressions:
      - {key: kubernetes.io/metadata.name, operator: NotIn, values: ["student-template"]}
  matchConditions:
  - name: platform-server-account
    expression: request.userInfo.username == 'system:serviceaccount:platform:platform-server'
  validations:
  - expression: object.metadata.name == params.metadata.name && dyn(object.spec) == dyn(params.spec)
    message: "the ResourceQuota must have the name and values of Infra/student/space.yaml, written the same way (16Gi, not 17179869184)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: wanggane-space-quota
spec:
  policyName: wanggane-space-quota
  validationActions: ["Deny"]
  paramRef:
    name: project-cap
    namespace: student-template
    parameterNotFoundAction: Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: wanggane-space-limits
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: LimitRange
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["limitranges"]
    namespaceSelector:
      matchExpressions:
      - {key: kubernetes.io/metadata.name, operator: NotIn, values: ["student-template"]}
  matchConditions:
  - name: platform-server-account
    expression: request.userInfo.username == 'system:serviceaccount:platform:platform-server'
  validations:
  - expression: object.metadata.name == params.metadata.name && dyn(object.spec) == dyn(params.spec)
    message: "the LimitRange must have the name and values of Infra/student/space.yaml, written the same way (4Gi, not 4294967296)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: wanggane-space-limits
spec:
  policyName: wanggane-space-limits
  validationActions: ["Deny"]
  paramRef:
    name: container-defaults
    namespace: student-template
    parameterNotFoundAction: Deny
---
# The name is fixed as well as the values: NetworkPolicies add up, so a second policy under another
# name could open what the first one closes.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: wanggane-space-isolation
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
  matchConstraints:
    resourceRules:
    - apiGroups: ["networking.k8s.io"]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["networkpolicies"]
    namespaceSelector:
      matchExpressions:
      - {key: kubernetes.io/metadata.name, operator: NotIn, values: ["student-template"]}
  matchConditions:
  - name: platform-server-account
    expression: request.userInfo.username == 'system:serviceaccount:platform:platform-server'
  validations:
  - expression: object.metadata.name == params.metadata.name && dyn(object.spec) == dyn(params.spec)
    message: the NetworkPolicy must have the name and values of Infra/student/space.yaml
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: wanggane-space-isolation
spec:
  policyName: wanggane-space-isolation
  validationActions: ["Deny"]
  paramRef:
    name: project-isolation
    namespace: student-template
    parameterNotFoundAction: Deny
---
# RBAC already limits the roles to proj-reader and proj-deployer (bind on those names only). This policy
# and the next fix who is bound to which: a RoleBinding named deploy-executor is checked by
# wanggane-space-deployers, every other name by this one.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: wanggane-space-readers
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
  matchConstraints:
    resourceRules:
    - apiGroups: ["rbac.authorization.k8s.io"]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["rolebindings"]
    namespaceSelector:
      matchExpressions:
      - {key: kubernetes.io/metadata.name, operator: NotIn, values: ["student-template"]}
  matchConditions:
  - name: platform-server-account
    expression: request.userInfo.username == 'system:serviceaccount:platform:platform-server'
  - name: not-the-executor-binding
    expression: object.metadata.name != 'deploy-executor'
  validations:
  - expression: >-
      object.metadata.name == params.metadata.name
      && dyn(object.roleRef) == dyn(params.roleRef)
      && dyn(object.subjects) == dyn(params.subjects)
    message: the RoleBinding must have the name, role and subject of Infra/student/space.yaml
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: wanggane-space-readers
spec:
  policyName: wanggane-space-readers
  validationActions: ["Deny"]
  paramRef:
    name: platform-server-read
    namespace: student-template
    parameterNotFoundAction: Deny
---
# The binding that lets the leader deploy executor work in the space (role proj-deployer,
# Infra/executor/account.yaml).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: wanggane-space-deployers
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
  matchConstraints:
    resourceRules:
    - apiGroups: ["rbac.authorization.k8s.io"]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["rolebindings"]
    namespaceSelector:
      matchExpressions:
      - {key: kubernetes.io/metadata.name, operator: NotIn, values: ["student-template"]}
  matchConditions:
  - name: platform-server-account
    expression: request.userInfo.username == 'system:serviceaccount:platform:platform-server'
  - name: the-executor-binding
    expression: object.metadata.name == 'deploy-executor'
  validations:
  - expression: >-
      dyn(object.roleRef) == dyn(params.roleRef)
      && dyn(object.subjects) == dyn(params.subjects)
    message: the RoleBinding deploy-executor must have the role and subject of Infra/student/space.yaml
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: wanggane-space-deployers
spec:
  policyName: wanggane-space-deployers
  validationActions: ["Deny"]
  paramRef:
    name: deploy-executor
    namespace: student-template
    parameterNotFoundAction: Deny
---
# Applies to every account, operators included. Pods are what runs; Deployments are checked too so that
# the deploy executor gets the refusal when it applies, not later as a ReplicaSet event.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: wanggane-student-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods", "pods/ephemeralcontainers"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments"]
  matchConditions:
  - name: student-space
    expression: request.namespace.startsWith('proj-')
  variables:
  - name: podSpec
    expression: "request.resource.resource == 'deployments' ? object.spec.template.spec : object.spec"
  - name: containers
    expression: >-
      variables.podSpec.containers
      + (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : [])
      + (has(variables.podSpec.ephemeralContainers) ? variables.podSpec.ephemeralContainers : [])
  validations:
  - expression: has(variables.podSpec.automountServiceAccountToken) && variables.podSpec.automountServiceAccountToken == false
    message: "student Pods must set automountServiceAccountToken: false"
  # The same token can be mounted by hand through a projected volume.
  - expression: >-
      !has(variables.podSpec.volumes) || variables.podSpec.volumes.all(v,
        !has(v.projected) || !has(v.projected.sources)
        || v.projected.sources.all(s, !has(s.serviceAccountToken)))
    message: "student Pods must not mount a serviceAccountToken volume"
  # baseline keeps NET_RAW, which lets a Pod spoof ARP on its worker.
  - expression: >-
      variables.containers.all(c,
        has(c.securityContext) && has(c.securityContext.capabilities)
        && has(c.securityContext.capabilities.drop)
        && c.securityContext.capabilities.drop.exists(d, d == 'NET_RAW' || d == 'ALL')
        && (!has(c.securityContext.capabilities.add)
            || !c.securityContext.capabilities.add.exists(a, a == 'NET_RAW' || a == 'ALL')))
    message: "every container in a student Pod must drop the NET_RAW capability"
  # The leader taint is NoSchedule, so a toleration would let a student Pod onto the leader. Kubernetes
  # itself adds the two NoExecute tolerations below to every Pod (how long it stays on a dead node).
  - expression: >-
      !has(variables.podSpec.tolerations) || variables.podSpec.tolerations.all(t,
        has(t.key) && t.key in ['node.kubernetes.io/not-ready', 'node.kubernetes.io/unreachable']
        && has(t.effect) && t.effect == 'NoExecute')
    message: "student Pods must not carry tolerations"
  # A preset nodeName skips the scheduler, and with it the taint. An existing Pod has the name the
  # scheduler gave it, so Pod updates are not checked.
  - expression: >-
      (request.resource.resource == 'pods' && request.operation == 'UPDATE')
      || !has(variables.podSpec.nodeName) || variables.podSpec.nodeName == ''
    message: "student Pods must not set nodeName"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: wanggane-student-pods
spec:
  policyName: wanggane-student-pods
  validationActions: ["Deny"]
