# Platform server account (build 09, first part). Design and reasons: docs/design/cluster.md §8.
# The platform server (Nest, on the EC2) calls the leader's API over Tailscale with this account's token.
# RBAC cannot filter by namespace name, so these rights are cluster-wide here and policies.yaml narrows
# them to proj- spaces and to the template values. Without those policies this account can write Secrets
# and delete namespaces anywhere: apply policies.yaml first, and delete this file first when removing.
# Apply (from the operator's machine):
#   ssh k3s-leader 'sudo k3s kubectl apply -f -' < Infra/platform/account.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    # Holds the account and its token only. No Pods run here.
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-server
  namespace: platform
automountServiceAccountToken: false
---
# Long-lived token, filled in by Kubernetes. No expiring credential to renew during the contest;
# deleting this Secret revokes the token (return, cluster.md §13). Read it only when it goes into the
# EC2's secret settings, and pipe it straight into that store or the clipboard, not onto the terminal:
#   ssh k3s-leader 'sudo k3s kubectl -n platform get secret platform-server-token -o jsonpath={.data.token}' | base64 --decode | <secret store or clipboard command>
apiVersion: v1
kind: Secret
metadata:
  name: platform-server-token
  namespace: platform
  annotations:
    kubernetes.io/service-account.name: platform-server
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-server
rules:
# The only cluster-scoped writes. No get, list, update or patch on namespaces.
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["create", "delete"]
# Create only: if the server could change or delete a space's cap and isolation, a leaked server
# credential would lift them first.
- apiGroups: [""]
  resources: ["resourcequotas", "limitranges"]
  verbs: ["create"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["create"]
# Write only. No patch: the response to a patch is the whole Secret, so an empty patch would read it.
# An update (PUT) replaces the object and returns only what was sent.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "update"]
# Reads inside a space come from a RoleBinding the server creates with the space (space.yaml), and so
# does the deploy executor's right to work there. It may bind the roles proj-reader and proj-deployer
# only, and policies.yaml fixes each binding's name and subject.
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["rolebindings"]
  verbs: ["create"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles"]
  resourceNames: ["proj-reader", "proj-deployer"]
  verbs: ["bind"]
# Nodes belong to no space. Name, addresses and Ready state, for the operator view.
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
---
# What the platform server may do in a space it was bound into: read, and stop a service. Not bound
# cluster-wide. The stop lives in this role so that the binding every space already has carries it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: proj-reader
rules:
- apiGroups: [""]
  resources: ["pods", "events"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
# Stop only: the scale subresource, not the Deployment itself (no image or spec change), and
# policies.yaml lets the server set 0 replicas only. get shows the replica count alone; kubectl reads it
# before it patches.
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-server
subjects:
- kind: ServiceAccount
  name: platform-server
  namespace: platform
